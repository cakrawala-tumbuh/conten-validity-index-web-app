name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: ESLint & TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Build Docker image (stage test)
        run: docker build -t cvi-web:test --target test .

      - name: Jalankan ESLint
        run: docker run --rm -e NODE_ENV=test cvi-web:test npm run lint

      - name: Periksa format Prettier
        run: docker run --rm -e NODE_ENV=test cvi-web:test npm run format:check

      - name: Periksa TypeScript
        run: docker run --rm -e NODE_ENV=test cvi-web:test npm run type-check
