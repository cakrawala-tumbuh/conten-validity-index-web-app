name: E2E Test (Playwright)

on:
  workflow_dispatch:
  schedule:
    # Jalankan setiap hari pukul 02:00 UTC (09:00 WIB)
    - cron: "0 2 * * *"

jobs:
  e2e:
    name: Playwright E2E (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web app
        uses: actions/checkout@v4
        with:
          path: web-app

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: cakrawala-tumbuh/content-validity-index-backend
          path: backend

      - name: Build image cvi-web:e2e
        working-directory: web-app
        run: docker build -t cvi-web:e2e --target e2e .

      - name: Build image cvi-backend:local
        working-directory: backend
        run: docker build -t cvi-backend:local .

      - name: Jalankan Playwright E2E di Docker
        working-directory: web-app
        run: |
          docker compose -f docker-compose.playwright.yml up \
            --abort-on-container-exit \
            --exit-code-from playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-app/playwright-report/
          retention-days: 7

      - name: Teardown stack
        if: always()
        working-directory: web-app
        run: docker compose -f docker-compose.playwright.yml down --remove-orphans -v
