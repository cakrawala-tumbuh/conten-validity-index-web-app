# docker-compose.e2e.yml — E2E test Playwright di Docker
#
# Menjalankan seluruh stack (backend, web, Authentik) dan container Playwright.
# Login otomatis via Authentik UI, storageState disimpan per role.
#
# Cara menjalankan:
#   docker compose -f docker-compose.e2e.yml up --abort-on-container-exit --exit-code-from playwright

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvi
      POSTGRES_PASSWORD: cvi_test
      POSTGRES_DB: cvi_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvi"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e-network

  authentik-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik_test
      POSTGRES_DB: authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - e2e-network

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.6
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik_test
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: e2e-test-secret-key-must-be-at-least-50-chars-long
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@cvi.test
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-AdminTest123!}
    ports:
      - "9000:9000"
    volumes:
      - ./blueprints:/blueprints/custom
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 15
    depends_on:
      authentik-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - e2e-network

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.6
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik_test
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: e2e-test-secret-key-must-be-at-least-50-chars-long
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - ./blueprints:/blueprints/custom
    depends_on:
      authentik-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - e2e-network

  backend:
    image: cvi-backend:local
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cvi:cvi_test@db:5432/cvi_test
      - AUTHENTIK_ISSUER_URL=http://authentik-server:9000/application/o/cvi/
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - e2e-network

  web:
    image: cvi-web:e2e
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://web:3000}
      - NEXTAUTH_SECRET=e2e-nextauth-secret
      - AUTHENTIK_ISSUER_URL=http://authentik-server:9000/application/o/cvi/
      - AUTHENTIK_EXTERNAL_URL=${AUTHENTIK_EXTERNAL_URL:-}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-cvi-e2e-client}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET:-cvi-e2e-secret}
      - AUTHENTIK_ADMIN_GROUP=cvi-admin
      - AUTHENTIK_EXPERT_GROUP=cvi-expert
      - BACKEND_API_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=CVI App
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/auth/providers"]
      interval: 10s
      timeout: 5s
      retries: 15
    depends_on:
      authentik-server:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - e2e-network

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    working_dir: /app
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: npx playwright test --headed
    environment:
      - PLAYWRIGHT_BASE_URL=http://web:3000
      - AUTHENTIK_URL=http://authentik-server:9000
      - TEST_ADMIN_EMAIL=admin@cvi.test
      - TEST_ADMIN_PASSWORD=${TEST_ADMIN_PASSWORD:-AdminTest123!}
      - TEST_EXPERT_EMAIL=expert@cvi.test
      - TEST_EXPERT_PASSWORD=${TEST_EXPERT_PASSWORD:-ExpertTest123!}
      - DISPLAY=${DISPLAY}
    networks:
      - e2e-network
    depends_on:
      web:
        condition: service_healthy

networks:
  e2e-network:
    driver: bridge
