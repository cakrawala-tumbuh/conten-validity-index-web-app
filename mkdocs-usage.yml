site_name: "CVI Manager - Panduan Pengguna"
site_description: "Panduan penggunaan lengkap aplikasi Content Validity Index (CVI) Manager"
site_author: "Cakrawala Tumbuh"
site_url: "https://cakrawala-tumbuh.github.io/conten-validity-index-web-app/"
repo_url: "https://github.com/cakrawala-tumbuh/conten-validity-index-web-app"
repo_name: "cakrawala-tumbuh/conten-validity-index-web-app"
edit_uri: edit/master/docs-usage/

docs_dir: docs-usage
site_dir: site-usage

theme:
  name: material
  language: id
  icon:
    logo: material/chart-box-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Ganti ke mode gelap
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Ganti ke mode terang
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      lang: id
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cakrawala-tumbuh/conten-validity-index-web-app

nav:
  - Beranda: index.md
  - Memulai:
    - Cara Memulai: memulai/index.md
  - Panduan Fitur:
    - Semua Fitur: panduan-fitur/index.md
    - Mengelola Instrumen: panduan-fitur/instrumen.md
    - Hasil CVI: panduan-fitur/hasil-cvi.md
    - Penilaian Saya (Expert): panduan-fitur/penilaian-saya.md
    - Mengelola Pengguna: panduan-fitur/pengguna.md
    - Bidang Keahlian: panduan-fitur/bidang-keahlian.md
    - Log Aktivitas: panduan-fitur/log-aktivitas.md
    - Profil Saya: panduan-fitur/profil-saya.md
  - Tutorial:
    - Daftar Tutorial: tutorial/index.md
    - Membuat & Menghitung CVI: tutorial/membuat-dan-menghitung-cvi.md
    - Menilai Instrumen (Expert): tutorial/menilai-instrumen.md
  - Referensi:
    - Memahami CVI: referensi/memahami-cvi.md
    - FAQ: referensi/faq.md
